server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  add_header Cache-Control "no-store" always;
  add_header X-Robots-Tag "noindex" always;

  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=3600";
  }

  # The page reads the API's liveness from here, same origin, so it needs no CORS on xvm-api.
  location = /_status {
    proxy_pass http://host.docker.internal:8002/health;
    proxy_connect_timeout 2s;
    proxy_read_timeout 3s;
  }

  # Written by maintenance.sh for the length of a window. The page falls back to its scheduled wording on a 404.
  location = /_maintenance.json {
    default_type application/json;
    try_files /status.json =404;
  }

  location ^~ /api/ {
    default_type application/json;
    add_header Retry-After 900 always;
    add_header Cache-Control "no-store" always;
    return 503 '{"error":"maintenance","message":"XIV Venue Manager is offline for maintenance. Try again shortly."}';
  }

  location / {
    return 503;
  }

  error_page 503 @maintenance;

  location @maintenance {
    rewrite ^ /index.html break;
    add_header Retry-After 900 always;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex" always;
  }
}
