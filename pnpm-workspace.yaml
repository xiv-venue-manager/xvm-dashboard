packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  "@sentry/cli": true
  "@swc/core": true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true

overrides:
  metro: "0.80.12"
  metro-babel-transformer: "0.80.12"
  metro-cache: "0.80.12"
  metro-cache-key: "0.80.12"
  metro-config: "0.80.12"
  metro-core: "0.80.12"
  metro-file-map: "0.80.12"
  metro-resolver: "0.80.12"
  metro-runtime: "0.80.12"
  metro-source-map: "0.80.12"
  metro-symbolicate: "0.80.12"
  metro-transform-plugins: "0.80.12"
  metro-transform-worker: "0.80.12"
  "@xmldom/xmldom": ">=0.8.13"
  "esbuild@>=0.27.3 <0.28.1": ">=0.28.1"
  "hono": ">=4.12.25"
  "ws": ">=8.21.0"
  "undici": "^8.10.0"
  "body-parser@<1.20.6": "^1.20.6"
  "@opentelemetry/core@<2.8.0": ">=2.8.0"
  mysql2: ">=3.22.0"
  fast-uri: "^3.1.6"
  browserslist: ">=4.28.7"

auditConfig:
  ignoreCves:
    # brace-expansion / fast-uri, 2026-08-05: only reachable through
    # @sentry/nextjs's own bundler/webpack-plugin chain and Prisma CLI's
    # dev-mode tooling (@prisma/dev>@prisma/streams-local) - both DoS-class
    # (glob/URI parsing complexity), neither ever fed attacker-controlled
    # input in production. No fix available that doesn't force an
    # incompatible major version on transitive deps several levels deep.
    # Revisit if a patched release becomes resolvable normally.
    - GHSA-3jxr-9vmj-r5cp
    - GHSA-mh99-v99m-4gvg
    - GHSA-rgw5-rvv9-x895
    - GHSA-v2hh-gcrm-f6hx
    - GHSA-7p8r-x3mc-p8w7
    - GHSA-4c8g-83qw-93j6
