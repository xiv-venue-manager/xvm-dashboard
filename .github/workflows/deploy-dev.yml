name: deploy-dev

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch to deploy to dev.xivvenuemanager.com
        required: true
        default: dev

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    # The label keeps this on the dev box. The CI runners are self-hosted too and must never take a deploy.
    runs-on: [self-hosted, deploy-dev]
    timeout-minutes: 25
    env:
      DEPLOY_REF: ${{ inputs.ref || 'dev' }}
    steps:
      - name: Pull branch
        run: |
          set -euo pipefail
          [[ "$DEPLOY_REF" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]] || { echo "Invalid branch name: $DEPLOY_REF (letters, digits, . _ / - only)"; exit 1; }
          cd /home/server/xiv-app-dev
          git fetch origin "+refs/heads/$DEPLOY_REF:refs/remotes/origin/$DEPLOY_REF"
          if [ "$DEPLOY_REF" = dev ]; then
            git checkout -f dev
            git reset --hard origin/dev
          else
            git checkout -f --detach "origin/$DEPLOY_REF"
          fi

      - name: Build dev image
        run: |
          set -euo pipefail
          cd /home/server/xiv-app
          env_file=/home/server/xiv-app-dev/.env.dev
          for key in NEXT_PUBLIC_DISCORD_APPLICATION_ID NEXT_PUBLIC_SENTRY_DSN SENTRY_AUTH_TOKEN; do
            value="$(sed -n "s/^${key}=//p" "$env_file" | tail -n 1 | tr -d "\"'\r")"
            [[ -n "$value" ]] || { echo "Missing $key in $env_file"; exit 1; }
            export "$key=$value"
          done
          docker compose --profile dev build venue-manager-dev

      - name: Restart dev container
        run: |
          cd /home/server/xiv-app
          docker compose --profile dev up -d venue-manager-dev

      - name: Record deployed revision
        run: |
          echo "Deployed \`$DEPLOY_REF\` at $(git -C /home/server/xiv-app-dev rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"
