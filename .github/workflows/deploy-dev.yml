name: deploy-dev

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch to deploy to dev.xivvenuemanager.com
        required: true
        default: dev

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 15
    env:
      DEPLOY_REF: ${{ inputs.ref || 'dev' }}
    steps:
      - name: Pull branch
        run: |
          set -euo pipefail
          [[ "$DEPLOY_REF" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]] || { echo "Invalid branch name: $DEPLOY_REF (letters, digits, . _ / - only)"; exit 1; }
          cd /home/server/xiv-app-dev
          git fetch origin "+refs/heads/$DEPLOY_REF:refs/remotes/origin/$DEPLOY_REF"
          if [ "$DEPLOY_REF" = dev ]; then
            git checkout -f dev
            git reset --hard origin/dev
          else
            git checkout -f --detach "origin/$DEPLOY_REF"
          fi

      - name: Sync dev database schema
        run: |
          set -euo pipefail
          env_file=/home/server/xiv-app-dev/.env.dev
          export DATABASE_URL="$(sed -n 's/^DATABASE_URL=//p' "$env_file" | tail -n 1 | tr -d "\"'\r")"
          [[ "$DATABASE_URL" =~ ^postgresql://dashboard_dev:[^@[:space:]]+@postgres:5432/dashboard_dev$ ]] || { echo "Refusing to sync: DATABASE_URL in $env_file is not the dashboard_dev database on postgres:5432"; exit 1; }
          network="$(docker inspect -f '{{range $name, $_ := .NetworkSettings.Networks}}{{$name}}{{end}}' postgres)"
          cd /home/server/xiv-app-dev
          docker build --quiet --target deps -f apps/web/Dockerfile -t dashboard-dev-schema-sync .
          docker run --rm --network "$network" -e DATABASE_URL \
            -v "$PWD/apps/web/prisma:/app/apps/web/prisma:ro" \
            -v "$PWD/apps/web/prisma.config.ts:/app/apps/web/prisma.config.ts:ro" \
            -w /app/apps/web dashboard-dev-schema-sync npx prisma db push

      - name: Rebuild and restart dev container
        run: |
          cd /home/server/xiv-app
          docker compose --profile dev up -d --build venue-manager-dev

      - name: Record deployed revision
        run: |
          echo "Deployed \`$DEPLOY_REF\` at $(git -C /home/server/xiv-app-dev rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"
