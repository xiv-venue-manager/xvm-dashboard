name: deploy-dev

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch to deploy to dev.xivvenuemanager.com
        required: true
        default: dev
      accept_data_loss:
        description: Back up dashboard_dev, then let the schema push drop data
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 15
    env:
      DEPLOY_REF: ${{ inputs.ref || 'dev' }}
      ACCEPT_DATA_LOSS: ${{ inputs.accept_data_loss && 'true' || 'false' }}
    steps:
      - name: Pull branch
        run: |
          set -euo pipefail
          [[ "$DEPLOY_REF" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]] || { echo "Invalid branch name: $DEPLOY_REF (letters, digits, . _ / - only)"; exit 1; }
          cd /home/server/xiv-app-dev
          git fetch origin "+refs/heads/$DEPLOY_REF:refs/remotes/origin/$DEPLOY_REF"
          if [ "$DEPLOY_REF" = dev ]; then
            git checkout -f dev
            git reset --hard origin/dev
          else
            git checkout -f --detach "origin/$DEPLOY_REF"
          fi

      - name: Build dev image
        run: |
          cd /home/server/xiv-app
          docker compose --profile dev build venue-manager-dev

      - name: Sync dev database schema
        run: |
          set -euo pipefail
          env_file=/home/server/xiv-app-dev/.env.dev
          export DATABASE_URL="$(sed -n 's/^DATABASE_URL=//p' "$env_file" | tail -n 1 | tr -d "\"'\r")"
          [[ "$DATABASE_URL" =~ ^postgresql://dashboard_dev:([A-Za-z0-9._~-]+)@postgres:5432/dashboard_dev$ ]] || { echo "Refusing to sync: DATABASE_URL in $env_file is not the dashboard_dev database on postgres:5432, or its password uses characters outside A-Z a-z 0-9 . _ ~ -"; exit 1; }
          push_flag=""
          if [ "$ACCEPT_DATA_LOSS" = true ]; then
            export PGPASSWORD="${BASH_REMATCH[1]}"
            mkdir -p /home/server/backups
            backup="/home/server/backups/dashboard_dev-$(date +%Y%m%d-%H%M%S).sql"
            (umask 077; docker exec -e PGPASSWORD postgres pg_dump -U dashboard_dev -h localhost dashboard_dev > "$backup") || { rm -f "$backup"; echo "Backup failed, stopping before the push"; exit 1; }
            [ -s "$backup" ] || { rm -f "$backup"; echo "Backup is empty, stopping before the push"; exit 1; }
            echo "Data loss accepted. Backup: $backup" | tee -a "$GITHUB_STEP_SUMMARY"
            push_flag=--accept-data-loss
          fi
          network="$(docker inspect -f '{{range $name, $_ := .NetworkSettings.Networks}}{{println $name}}{{end}}' postgres | head -n 1)"
          cd /home/server/xiv-app-dev
          docker build --quiet --target deps -f apps/web/Dockerfile -t dashboard-dev-schema-sync .
          docker run --rm --network "$network" -e DATABASE_URL \
            -v "$PWD/apps/web/prisma:/app/apps/web/prisma:ro" \
            -v "$PWD/apps/web/prisma.config.ts:/app/apps/web/prisma.config.ts:ro" \
            -w /app/apps/web dashboard-dev-schema-sync npx prisma db push $push_flag

      - name: Restart dev container
        run: |
          cd /home/server/xiv-app
          docker compose --profile dev up -d venue-manager-dev

      - name: Record deployed revision
        run: |
          echo "Deployed \`$DEPLOY_REF\` at $(git -C /home/server/xiv-app-dev rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"
